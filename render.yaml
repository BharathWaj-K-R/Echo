services:
  - type: web
    name: echo-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_URL
        value: https://api.groq.com/openai/v1/chat/completions
      - key: LLM_MODEL
        value: mixtral-8x7b-32768
      - key: POSTGRES_DSN
        fromDatabase:
          name: echo-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: echo-cache
          type: redis
          property: connectionString
      - key: PORT
        value: "8080"
    healthCheckPath: /health
    autoDeploy: true

  - type: redis
    name: echo-cache
    plan: free
    ipAllowList: []

databases:
  - name: echo-postgres
    plan: free
